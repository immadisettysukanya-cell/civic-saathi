
spring.application.name=civicsaathi
server.port=8088
civicsaathi.ollama.url=${CIVICSAATHI_OLLAMA_URL:http://localhost:11434}
civicsaathi.ollama.model=${CIVICSAATHI_OLLAMA_MODEL:llama3.2}
# CivicSaathi local authentication database
spring.datasource.url=jdbc:h2:file:./data/civicsaathi;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Gmail SMTP settings are supplied through environment variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${CIVICSAATHI_MAIL_USERNAME:}
spring.mail.password=${CIVICSAATHI_MAIL_PASSWORD:}