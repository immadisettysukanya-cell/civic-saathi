services:
  backend:
    build:
      context: ./backend
    environment:
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/civicsaathi;DB_CLOSE_ON_EXIT=FALSE"
      CIVICSAATHI_OLLAMA_URL: "${CIVICSAATHI_OLLAMA_URL:-http://host.docker.internal:11434}"
      CIVICSAATHI_OLLAMA_MODEL: "${CIVICSAATHI_OLLAMA_MODEL:-llama3.2}"
      CIVICSAATHI_MAIL_USERNAME: "${CIVICSAATHI_MAIL_USERNAME:-}"
      CIVICSAATHI_MAIL_PASSWORD: "${CIVICSAATHI_MAIL_PASSWORD:-}"
    volumes:
      - civicsaathi-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  civicsaathi-data:
